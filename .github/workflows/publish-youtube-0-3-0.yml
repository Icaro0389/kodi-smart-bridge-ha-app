name: Publish YouTube pilot v0.3.0
on:
  push:
    paths:
      - '.github/workflows/publish-youtube-0-3-0.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish pilot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.3.0 --target "${GITHUB_SHA}" --title "v0.3.0 — YouTube pilot" --notes "Pilot YouTube Data API v3 search and Kodi playback. Configure youtube_api_key in the App options. Requires related YouTube pilot components." --prerelease
