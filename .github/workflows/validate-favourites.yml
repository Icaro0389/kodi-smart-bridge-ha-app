name: Validate favourite backend
on:
  push:
    branches: [feature/kodi-native-favourites]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile kodi-smart-bridge/app/bridge.py kodi-smart-bridge/app/refresh-direct-catalogs.py kodi-smart-bridge/app/runner.py
